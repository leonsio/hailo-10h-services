[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hailo-10h-services"
version = "0.1.0"
description = "Resident SHARED Hailo-10H Qwen2-VL and Whisper gateway"
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn>=0.30,<1", "python-multipart>=0.0.18,<1",
  "numpy>=1.24,<3", "Pillow>=10.4,<13", "scipy>=1.10,<2", "soundfile>=0.12,<1",
  "wyoming>=1.7,<2", "mcp>=2.3,<3", "aiomqtt>=2.3,<3",
  "PyYAML>=6,<7", "Jinja2>=3.1.6,<4",
  "jsonschema>=4.23,<5",
  "safetensors>=0.4,<1", "tokenizers>=0.20,<1",
]

[project.optional-dependencies]
test = ["pytest>=8,<10", "httpx>=0.27,<1", "ruff>=0.8"]

[project.scripts]
hailo-10h-services = "hailo_services.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
hailo_services = ["web/*.html", "web/*.css", "web/*.js", "locales/*.json", "model_catalog.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]
