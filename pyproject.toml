[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "hailo-10h-services"
version = "0.1.0"
description = "Resident Hailo-10H chat, speech and vision services with CPU LiteRT support"
license = "Apache-2.0"
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md"]
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn>=0.30,<1", "python-multipart>=0.0.18,<1",
  "numpy>=1.24,<3", "Pillow>=10.4,<13", "scipy>=1.10,<2", "soundfile>=0.12,<1",
  "wyoming>=1.7,<2", "mcp>=2.3,<3", "aiomqtt>=2.3,<3", "pyzmq>=26,<28",
  "PyYAML>=6,<7", "Jinja2>=3.1.6,<4",
  "jsonschema>=4.23,<5",
  "hassil>=3.10,<4", "home-assistant-intents==2026.9.30", "rapidfuzz>=3.9,<4",
  "safetensors>=0.4,<1", "tokenizers>=0.20,<1",
]

[project.optional-dependencies]
piper = ["piper-tts>=1.3,<2"]
test = ["pytest>=8,<10", "httpx>=0.27,<1", "ruff>=0.8", "hypothesis>=6,<7"]

[project.scripts]
hailo-10h-services = "hailo_services.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
hailo_services = ["web/*.html", "web/*.css", "web/*.js", "locales/*.json", "model_catalog.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "D100", "D101", "D102", "D103", "D104", "D105", "D107", "D205", "D209", "D400", "D417"]
ignore = ["E501"]

# PEP 257 / Google-style coverage is enforced for production modules.
[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D"]
# Internal proxy methods deliberately mirror the documented public backend contracts.
"src/hailo_services/_process/worker.py" = ["D102", "D107"]
